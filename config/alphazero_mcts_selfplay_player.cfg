{
    "name": "AlphaZeroMCTSPlayer",
    "microseconds": 0,
    "nb simulations": 800,
    "nb threads": 1,
    "batch size": 8,
    "backend": "torch",
    "device": "cuda",
    "fp16": true,
    "weights": "../nnue/cnn_resnet_256x30_value_policy.ts",

    "dirichlet alpha": 0.3,
    "dirichlet epsilon": 0.25,
    "temperature": 1.0,
    "temperature cutoff": 20,
    "forced playouts k": 2.0,
    "playout cap fast prob": 0.75,
    "nb simulations fast": 200,
    "policy target pruning": true,

    "graph search": true,
    "reuse tree": true,
    "nn cache": 16,
    "verbose": false
}
