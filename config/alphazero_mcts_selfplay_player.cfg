{
    "name": "AlphaZeroMCTSPlayer",
    "description": "AlphaZero/KataGo-style MCTS: PUCT with KataGo's exploration terms, graph search (transpositions), LCB move choice, guided by the value/policy ResNet 256×30 (convnet); self-play settings of the learning loop (1600/200 simulations, Dirichlet noise, move sampling in the opening, forced playouts) — not meant for competitive play.",
    "microseconds": 0,
    "nb simulations": 1600,
    "nb threads": 1,
    "batch size": 8,
    "backend": "torch",
    "device": "cuda",
    "fp16": true,
    "weights": "../nnue/cnn_resnet_256x30_value_policy.ts",
    "dirichlet alpha": 0.3,
    "dirichlet epsilon": 0.25,
    "temperature": 1.0,
    "temperature cutoff": 20,
    "forced playouts k": 2.0,
    "playout cap fast prob": 0.75,
    "nb simulations fast": 200,
    "policy target pruning": true,
    "graph search": true,
    "reuse tree": true,
    "nn cache": 16,
    "verbose": false
}
