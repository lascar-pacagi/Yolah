{
    "name": "AlphaZeroMCTSPlayer",
    "description": "AlphaZero/KataGo-style MCTS: PUCT with KataGo's exploration terms, graph search (transpositions), LCB move choice, guided by the value/policy ResNet 256×30 (convnet); settings of the evaluation matches of the self-play learning (no noise, no sampling).",
    "microseconds": 2000000,
    "nb simulations": 0,
    "nb threads": 4,
    "batch size": 32,
    "backend": "torch",
    "device": "cuda",
    "fp16": true,
    "weights": "set by alphazero_learn match",
    "graph search": true,
    "use lcb": true,
    "dirichlet epsilon": 0.0,
    "temperature": 0.0,
    "forced playouts k": 0.0,
    "playout cap fast prob": 0.0,
    "reuse tree": true,
    "nn cache": 64,
    "verbose": false
}
