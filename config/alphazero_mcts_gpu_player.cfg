    "cpuct exploration": 1.0,
    "cpuct exploration log": 0.45,
    "cpuct exploration base": 500,
    "cpuct utility stdev scale": 0.85,
    "fpu reduction": 0.2,
    "root fpu reduction": 0.1,
    "graph search": true,
    "use lcb": true,
    "policy temperature": 1.0,
    "dirichlet epsilon": 0.0,
    "temperature": 0.0,
    "reuse tree": true,
    "nn cache": 64,
    "verbose": false
}
